<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect with Poornima Jagannath</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f4ef;
        color: #141821;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: min(78vw, 320px);
        height: auto;
        background: white;
        border-radius: 18px;
        box-shadow: 0 22px 60px rgb(20 24 33 / 14%);
      }

      h1 {
        margin: 24px 0 8px;
        font-size: clamp(28px, 7vw, 44px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0 auto 22px;
        max-width: 34ch;
        color: #5d6470;
        font-size: 17px;
        line-height: 1.45;
      }

      a {
        color: inherit;
        font-weight: 700;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.16em;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #10141a;
          color: #f4f1ea;
        }

        p {
          color: #c9c2b7;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/poornima-linkedin-qr.svg"
        width="320"
        height="320"
        alt="QR code linking to Poornima Jagannath on LinkedIn"
      />
      <h1>Connect with me on LinkedIn</h1>
      <p>I write about developer experience, APIs, SDKs, AI, and things I build.</p>
      <a href="https://www.linkedin.com/in/poornima-j/">Open LinkedIn</a>
    </main>
  <!-- posthog -->
<script src="/assets/posthog-config.js"></script>
<script src="/assets/posthog-loader.js"></script>
</body>
</html>
